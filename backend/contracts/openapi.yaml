openapi: 3.1.0
info:
  title: Первый PR — публичный API
  version: 1.3.0
security:
- demoSession: []
paths:
  /api/session:
    post:
      operationId: login
      summary: Открыть тестовую сессию
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              examples:
                initial:
                  externalValue: ./examples/initial.json
          headers:
            Set-Cookie:
              description: buddy_session, HttpOnly, SameSite=Strict; Secure при HTTPS
              schema:
                type: string
                minLength: 1
        '400': &id003
          description: Проверьте ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_input:
                  externalValue: ./examples/invalid_input.json
        '401':
          description: Войдите снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_expired:
                  externalValue: ./examples/session_expired.json
        '503':
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  externalValue: ./examples/unavailable.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              login:
                externalValue: ./examples/login.json
      security: []
    get:
      summary: Получить идентичность текущей сессии
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401': &id001
          description: Войдите снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_expired:
                  externalValue: ./examples/session_expired.json
        '503': &id002
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  externalValue: ./examples/unavailable.json
    delete:
      summary: Завершить сессию на сервере
      responses:
        '200':
          description: Сессия завершена
        '401': *id001
        '503': *id002
  /api/workspace:
    get:
      operationId: getWorkspace
      summary: Восстановить состояние из доверенной сессии
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              examples:
                initial:
                  externalValue: ./examples/initial.json
                pending:
                  externalValue: ./examples/pending.json
                approved:
                  externalValue: ./examples/approved.json
                granted:
                  externalValue: ./examples/granted.json
                rejected:
                  externalValue: ./examples/rejected.json
        '401': *id001
        '403': &id004
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  externalValue: ./examples/forbidden.json
        '503': *id002
  /api/messages:
    post:
      operationId: sendMessage
      summary: Получить ответ и возможное предложение без создания заявки
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
              examples:
                proposal:
                  externalValue: ./examples/proposal.json
        '400':
          description: Проверьте ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_input:
                  externalValue: ./examples/invalid_input.json
        '401':
          description: Войдите снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_expired:
                  externalValue: ./examples/session_expired.json
        '403':
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  externalValue: ./examples/forbidden.json
        '409':
          description: Обновите состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  externalValue: ./examples/conflict.json
        '503':
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  externalValue: ./examples/unavailable.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
            examples:
              question:
                externalValue: ./examples/question.json
  /api/proposals/{id}/confirm:
    post:
      operationId: confirmProposal
      summary: Подтвердить предложение и получить сохранённое состояние
      description: Отправляйте пустое тело и один Idempotency-Key. При повторе подтверждения
        request содержит исходный номер заявки и её текущий статус. GET /api/workspace
        показывает актуальную заявку по назначению. Чужое или неизвестное предложение
        даёт одинаковый 403; устаревший контекст или повтор ключа с другим предложением
        — 409.
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              examples:
                pending:
                  externalValue: ./examples/pending.json
        '400':
          description: Проверьте ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_input:
                  externalValue: ./examples/invalid_input.json
        '401':
          description: Войдите снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_expired:
                  externalValue: ./examples/session_expired.json
        '403':
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  externalValue: ./examples/forbidden.json
        '409':
          description: Обновите состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  externalValue: ./examples/conflict.json
        '503':
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  externalValue: ./examples/unavailable.json
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[!-+\--~]+$
        example: confirm-c43ea025-8bb2-4237-905b-305aefaafd6b
  /api/events:
    post:
      summary: Зафиксировать намерение вернуться к задаче после выдачи доступа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskReturnInput'
      responses:
        '200':
          description: Событие записано
        '400': *id003
        '401': *id001
        '403': *id004
        '503': *id002
  /api/requests:
    get:
      operationId: listPortalRequests
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortalTicket'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          type: string
          enum:
          - queue
  /api/requests/{kind}:
    post:
      operationId: createPortalRequest
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalTicket'
        '400':
          $ref: '#/components/responses/PortalBadRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '403':
          $ref: '#/components/responses/PortalForbidden'
        '404':
          $ref: '#/components/responses/PortalNotFound'
        '409':
          $ref: '#/components/responses/PortalConflict'
      parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - leave
          - access
          - technical_support
          - mentor_consultation
          - learning_request
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/PortalCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalTicketInput'
            examples:
              demo:
                externalValue: ./examples/portal-support.json
  /api/requests/{requestId}/{operation}:
    post:
      operationId: mutatePortalRequest
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalTicket'
        '400':
          $ref: '#/components/responses/PortalBadRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '403':
          $ref: '#/components/responses/PortalForbidden'
        '404':
          $ref: '#/components/responses/PortalNotFound'
        '409':
          $ref: '#/components/responses/PortalConflict'
      parameters:
      - name: X-Request-Version
        in: header
        required: false
        schema:
          type: string
          format: date-time
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      - name: operation
        in: path
        required: true
        schema:
          type: string
          enum:
          - send
          - approve
          - reject
          - edit
          - claim
          - resolve
          - close
          - reopen
          - schedule
          - propose
          - accept
          - counter
          - complete
          - recommend
      - $ref: '#/components/parameters/PortalCsrf'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalTicketOperationInput'
  /api/kb/search:
    get:
      operationId: searchPortalKnowledge
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortalKnowledgeHit'
        '400':
          $ref: '#/components/responses/PortalBadRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '403':
          $ref: '#/components/responses/PortalForbidden'
        '404':
          $ref: '#/components/responses/PortalNotFound'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: track
        in: query
        required: false
        schema:
          type: string
      - name: taskId
        in: query
        required: false
        schema:
          type: string
  /api/adaptation/plan:
    get:
      operationId: getAdaptationPlan
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdaptationPlan'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
  /api/adaptation/items/{itemId}/transition:
    post:
      operationId: transitionAdaptationItem
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdaptationPlan'
        '400':
          $ref: '#/components/responses/PortalBadRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '403':
          $ref: '#/components/responses/PortalForbidden'
        '404':
          $ref: '#/components/responses/PortalNotFound'
        '409':
          $ref: '#/components/responses/PortalConflict'
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/PortalCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
                  enum:
                  - in_progress
                  - evidence_pending
                  - completed
                evidenceUri:
                  type: string
              required:
              - target
  /api/adaptation/first-task/{operation}:
    post:
      operationId: changeFirstTask
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PortalOk'
                - type: object
                  properties:
                    code:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    demo:
                      type: boolean
                  required:
                  - code
                  - title
                  - description
                  - demo
        '400':
          $ref: '#/components/responses/PortalBadRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '403':
          $ref: '#/components/responses/PortalForbidden'
        '404':
          $ref: '#/components/responses/PortalNotFound'
        '409':
          $ref: '#/components/responses/PortalConflict'
      parameters:
      - name: operation
        in: path
        required: true
        schema:
          type: string
          enum:
          - assign
          - open
          - start
          - confirm
      - $ref: '#/components/parameters/PortalCsrf'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
  /api/adaptation/metrics:
    get:
      operationId: getAdaptationMetrics
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalMetrics'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
  /api/chat/config:
    get:
      operationId: getPortalChatConfig
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  aiMode:
                    type: string
                    enum:
                    - demo
                    - live
                required:
                - aiMode
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
  /api/chats:
    get:
      operationId: listPortalChats
      responses:
        '200':
          description: Чаты текущего пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortalChatSummary'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
    post:
      operationId: createPortalChat
      parameters:
      - $ref: '#/components/parameters/PortalCsrf'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '201':
          description: Чат создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalChatSummary'
        '400':
          $ref: '#/components/responses/PortalBadRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
  /api/chats/{chatId}:
    delete:
      operationId: deletePortalChat
      parameters:
      - $ref: '#/components/parameters/PortalChatId'
      - $ref: '#/components/parameters/PortalCsrf'
      responses:
        '204':
          description: Чат удалён
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '404':
          $ref: '#/components/responses/PortalNotFound'
  /api/chats/{chatId}/messages:
    get:
      operationId: readPortalChatHistory
      parameters:
      - $ref: '#/components/parameters/PortalChatId'
      responses:
        '200':
          description: История чата текущего пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PortalChatMessage'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '404':
          $ref: '#/components/responses/PortalNotFound'
  /api/chat:
    post:
      operationId: sendPortalChat
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalChatReply'
        '400':
          $ref: '#/components/responses/PortalBadRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '403':
          $ref: '#/components/responses/PortalForbidden'
        '404':
          $ref: '#/components/responses/PortalNotFound'
        '409':
          $ref: '#/components/responses/PortalConflict'
        '503':
          $ref: '#/components/responses/PortalUnavailable'
      parameters:
      - $ref: '#/components/parameters/PortalCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalChatInput'
            examples:
              demo:
                externalValue: ./examples/portal-chat.json
  /api/chat/feedback:
    post:
      operationId: recordPortalChatFeedback
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalOk'
        '400':
          $ref: '#/components/responses/PortalBadRequest'
        '401':
          $ref: '#/components/responses/PortalUnauthorized'
        '403':
          $ref: '#/components/responses/PortalForbidden'
        '404':
          $ref: '#/components/responses/PortalNotFound'
        '409':
          $ref: '#/components/responses/PortalConflict'
      parameters:
      - $ref: '#/components/parameters/PortalCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: string
                outcome:
                  type: string
                  enum:
                  - resolved
                  - mentor
              required:
              - messageId
              - outcome
components:
  responses:
    PortalBadRequest:
      description: Проверьте данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalError'
    PortalUnauthorized:
      description: Истекла сессия
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalError'
    PortalForbidden:
      description: Операция недоступна
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalError'
    PortalNotFound:
      description: Ресурс недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalError'
    PortalConflict:
      description: Состояние изменилось
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalError'
    PortalUnavailable:
      description: Помощник временно недоступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalError'
  parameters:
    PortalChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        pattern: ^chat-[0-9a-f]{24}$
    PortalCsrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
  securitySchemes:
    demoSession:
      type: apiKey
      in: cookie
      name: buddy_session
  schemas:
    PortalError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    PortalOk:
      type: object
      properties:
        ok:
          const: true
      required:
      - ok
    PortalTicket:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - leave
          - access
          - technical_support
          - mentor_consultation
          - learning_request
        status:
          type: string
          enum:
          - draft
          - sent
          - approving
          - approved
          - rejected
          - in_progress
          - resolved
          - closed
          - awaiting_confirmation
          - scheduled
          - completed
        authorId:
          type: string
        authorName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        payload:
          oneOf:
          - type: object
            properties:
              kind:
                const: leave
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
              reason:
                type: string
              comment:
                type: string
            required:
            - kind
          - type: object
            properties:
              kind:
                const: access
              system:
                type: string
              justification:
                type: string
              durationDays:
                type: integer
                minimum: 1
                maximum: 365
              taskId:
                type: string
            required:
            - kind
          - type: object
            properties:
              kind:
                const: technical_support
              category:
                type: string
                enum:
                - environment
                - software
                - network
                - git
                - other
              title:
                type: string
              description:
                type: string
              priority:
                type: string
                enum:
                - low
                - normal
                - high
              taskId:
                type: string
            required:
            - kind
          - type: object
            properties:
              kind:
                const: mentor_consultation
              topic:
                type: string
              description:
                type: string
              preferredAt:
                type: string
                format: date-time
              taskId:
                type: string
            required:
            - kind
          - type: object
            properties:
              kind:
                const: learning_request
              topic:
                type: string
              track:
                type: string
                enum:
                - backend
                - analytics
                - marketing
              reason:
                type: string
              taskId:
                type: string
            required:
            - kind
        allowedActions:
          type: array
          items:
            type: string
        history:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              status:
                type: string
              by:
                type: string
              comment:
                type: string
              scheduledAt:
                type: string
                format: date-time
            required:
            - at
            - status
            - by
        assignee:
          anyOf:
          - type: object
            properties:
              id:
                type: string
              name:
                type: string
            required:
            - id
            - name
          - type: 'null'
        taskId:
          anyOf:
          - type: string
          - type: 'null'
        scheduledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        proposedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        result:
          anyOf:
          - type: object
            properties:
              text:
                type: string
              url:
                anyOf:
                - type: string
                - type: 'null'
            required:
            - text
            - url
          - type: 'null'
      required:
      - id
      - kind
      - status
      - authorId
      - payload
      - history
