[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-buddy-ai"
version = "0.0.0"
description = "AI zone (agent, context, providers) of the AI-buddy 'First PR' prototype - Hack&Change 2026"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

# Flat layout is dictated by plan.md (ai/context, ai/agent, ai/providers).
# Editable install is optional: tests and uvicorn also run from ai/ via
# pytest's pythonpath setting below.
[tool.setuptools]
packages = ["agent", "context", "evals", "providers"]
py-modules = ["server", "settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["agent", "context", "evals", "providers", "server", "settings"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# AI zone target is >= 90% (plan.md); the team-wide >80% report is owned by B6
# and must be computed over non-overlapping lines, never averaged percents.
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
