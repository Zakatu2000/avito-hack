openapi: 3.1.0
info:
  title: Первый PR — публичный API
  version: 1.1.0
security:
- demoSession: []
paths:
  /api/session:
    post:
      operationId: login
      summary: Открыть тестовую сессию
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              examples:
                initial:
                  externalValue: ./examples/initial.json
          headers:
            Set-Cookie:
              description: buddy_session, HttpOnly, SameSite=Strict; Secure при HTTPS
              schema:
                type: string
                minLength: 1
        '400':
          description: Проверьте ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_input:
                  externalValue: ./examples/invalid_input.json
        '401':
          description: Войдите снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_expired:
                  externalValue: ./examples/session_expired.json
        '503':
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  externalValue: ./examples/unavailable.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            examples:
              login:
                externalValue: ./examples/login.json
      security: []
  /api/workspace:
    get:
      operationId: getWorkspace
      summary: Восстановить состояние из доверенной сессии
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              examples:
                initial:
                  externalValue: ./examples/initial.json
                pending:
                  externalValue: ./examples/pending.json
                approved:
                  externalValue: ./examples/approved.json
                granted:
                  externalValue: ./examples/granted.json
                rejected:
                  externalValue: ./examples/rejected.json
        '401':
          description: Войдите снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_expired:
                  externalValue: ./examples/session_expired.json
        '403':
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  externalValue: ./examples/forbidden.json
        '503':
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  externalValue: ./examples/unavailable.json
  /api/messages:
    post:
      operationId: sendMessage
      summary: Получить ответ и возможное предложение без создания заявки
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
              examples:
                proposal:
                  externalValue: ./examples/proposal.json
        '400':
          description: Проверьте ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_input:
                  externalValue: ./examples/invalid_input.json
        '401':
          description: Войдите снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_expired:
                  externalValue: ./examples/session_expired.json
        '403':
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  externalValue: ./examples/forbidden.json
        '503':
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  externalValue: ./examples/unavailable.json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInput'
            examples:
              question:
                externalValue: ./examples/question.json
  /api/proposals/{id}/confirm:
    post:
      operationId: confirmProposal
      summary: Подтвердить предложение и получить сохранённое состояние
      description: >-
        Отправляйте пустое тело и один Idempotency-Key. При повторе подтверждения
        request содержит исходный номер заявки и её текущий статус. GET /api/workspace
        показывает актуальную заявку по назначению. Чужое или неизвестное предложение
        даёт одинаковый 403; устаревший контекст или повтор ключа с другим предложением — 409.
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
              examples:
                pending:
                  externalValue: ./examples/pending.json
        '400':
          description: Проверьте ввод
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_input:
                  externalValue: ./examples/invalid_input.json
        '401':
          description: Войдите снова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                session_expired:
                  externalValue: ./examples/session_expired.json
        '403':
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  externalValue: ./examples/forbidden.json
        '409':
          description: Обновите состояние
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                conflict:
                  externalValue: ./examples/conflict.json
        '503':
          description: Сервис временно недоступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                unavailable:
                  externalValue: ./examples/unavailable.json
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          minLength: 1
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[!-+\--~]+$'
        example: confirm-c43ea025-8bb2-4237-905b-305aefaafd6b
components:
  securitySchemes:
    demoSession:
      type: apiKey
      in: cookie
      name: buddy_session
  schemas:
    Task:
      type: object
      required:
      - taskId
      - title
      - resourceId
      additionalProperties: false
      properties:
        taskId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        resourceId:
          type: string
          minLength: 1
    Source:
      type: object
      required:
      - sourceId
      - excerpt
      additionalProperties: false
      properties:
        sourceId:
          type: string
          minLength: 1
        excerpt:
          type: string
          minLength: 1
    Ticket:
      type: object
      required:
      - requestId
      - requestStatus
      additionalProperties: false
      properties:
        requestId:
          type: string
          minLength: 1
        requestStatus:
          type: string
          enum:
          - pending
          - approved
          - rejected
    Proposal:
      type: object
      required:
      - proposalId
      - resourceId
      - summary
      additionalProperties: false
      properties:
        proposalId:
          type: string
          minLength: 1
        resourceId:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
    Error:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - invalid_input
          - session_expired
          - forbidden
          - conflict
          - unavailable
        message:
          type: string
          minLength: 1
    Login:
      type: object
      required:
      - username
      - password
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    MessageInput:
      type: object
      required:
      - text
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
    Workspace:
      type: object
      required:
      - task
      - source
      - effectiveAccess
      - request
      - nextStep
      additionalProperties: false
      properties:
        task:
          anyOf:
          - $ref: '#/components/schemas/Task'
          - type: 'null'
        source:
          anyOf:
          - $ref: '#/components/schemas/Source'
          - type: 'null'
        effectiveAccess:
          type: string
          enum:
          - unknown
          - missing
          - granted
        request:
          anyOf:
          - $ref: '#/components/schemas/Ticket'
          - type: 'null'
        nextStep:
          type: string
          minLength: 1
    Reply:
      type: object
      required:
      - text
      - source
      - proposal
      - workspace
      - aiMode
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
        source:
          anyOf:
          - $ref: '#/components/schemas/Source'
          - type: 'null'
        proposal:
          anyOf:
          - $ref: '#/components/schemas/Proposal'
          - type: 'null'
        workspace:
          $ref: '#/components/schemas/Workspace'
        aiMode:
          type: string
          enum:
          - live
          - demo
