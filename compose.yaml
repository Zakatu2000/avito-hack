services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.integrated
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://buddy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/avito_buddy_demo
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      PORTAL_PROTECT_LEGACY: "1"
      AI_MODE: ${AI_MODE:-demo}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-8}
      BUDDY_AGENT_FACTORY: ${BUDDY_AGENT_FACTORY:-}
      BUDDY_AGENT_TIMEOUT: ${BUDDY_AGENT_TIMEOUT:-12}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: avito_buddy_demo
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - buddy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d avito_buddy_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  buddy_pg:
