services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: avito_buddy_demo
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - buddy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buddy -d avito_buddy_demo"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://buddy:${POSTGRES_PASSWORD}@db:5432/avito_buddy_demo
      BUDDY_DEMO_OPERATOR: ${BUDDY_DEMO_OPERATOR:-0}
    ports:
      - "127.0.0.1:${BUDDY_PORT:-5050}:5050"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  checks:
    profiles: ["checks"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    build:
      context: .
      target: checks
    environment:
      TEST_ADMIN_DATABASE_URL: postgresql://buddy:${POSTGRES_PASSWORD}@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports

volumes:
  buddy_pg:
